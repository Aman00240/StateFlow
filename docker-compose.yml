services:
    backend:
        build: .
        ports:
            - "8000:8000"
        environment:
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/stateflow
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/app
            - /app/.venv
        env_file:
            - .env
        command:
            [
                "uv",
                "run",
                "uvicorn",
                "main:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8000",
                "--reload",
            ]

    db:
        image: postgres:15
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=stateflow
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d stateflow"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
